<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#03050a" />
    <meta name="description" content="An interactive 3D observatory: a procedurally built space station in orbit above a shader-generated planet." />
    <title>Fable Station</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2303050a'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%237fd8ff' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23ffd9a0'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene" tabindex="0" aria-label="3D view of Fable Station in orbit. Drag to orbit, scroll or pinch to zoom, arrow keys to rotate."></canvas>

    <div class="letterbox top" aria-hidden="true"></div>
    <div class="letterbox bottom" aria-hidden="true"></div>

    <div id="hud">
      <header class="brand">
        <p class="eyebrow">Orbital observatory</p>
        <h1>Fable Station</h1>
        <p class="telemetry" id="telemetry"></p>
      </header>

      <div class="controls" role="toolbar" aria-label="Scene controls">
        <button type="button" id="btn-pause" aria-pressed="false" title="Pause rotation (P)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4v12M14 4v12" /></svg>
          <span>Pause</span>
        </button>
        <button type="button" id="btn-eclipse" aria-pressed="false" title="Eclipse lighting (E)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6" /><path d="M10 4a6 6 0 0 0 0 12a8 8 0 0 1 0-12z" class="fill" /></svg>
          <span>Eclipse</span>
        </button>
        <button type="button" id="btn-audio" aria-pressed="false" title="Ambient sound (M)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8v4h3l4 3V5L6 8zM13.5 7.5a3.5 3.5 0 0 1 0 5M15.5 5a7 7 0 0 1 0 10" /></svg>
          <span>Sound</span>
        </button>
        <button type="button" id="btn-cinematic" aria-pressed="false" title="Cinematic mode (H)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="5" width="15" height="10" rx="1.5" /><path d="M2.5 8h15M2.5 12h15" /></svg>
          <span>Cinematic</span>
        </button>
      </div>

      <aside class="panel" id="panel" aria-label="Details">
        <button type="button" class="panel-head" id="panel-head" aria-expanded="true" aria-controls="panel-body">
          <span>
            <span class="eyebrow" id="panel-eyebrow"></span>
            <span class="panel-title" id="panel-title"></span>
          </span>
          <svg class="chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 8l5 5l5-5" /></svg>
        </button>
        <div class="panel-body" id="panel-body" aria-live="polite"></div>
      </aside>

      <nav class="views" id="views" aria-label="Camera views"></nav>
      <p class="hint" id="hint"></p>
    </div>

    <button type="button" id="exit-cinematic">Exit cinematic <kbd>Esc</kbd></button>
    <div id="tooltip" role="presentation"></div>
    <div id="veil" aria-hidden="true"></div>
    <noscript><p class="fallback">Fable Station needs JavaScript and WebGL to run.</p></noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
